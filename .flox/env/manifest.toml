version = 1

[install]
python3.pkg-path = "python3"

[hook]
on-activate = '''
  echo ""
  echo "🌐 TRMNL Dashboard Development Environment"
  echo ""
  echo "To start the dev server:"
  echo "  flox services start dev"
  echo ""
  echo "Then visit: http://localhost:8000"
  echo ""
'''

[services]
dev.command = "python3 fetch_recipes.py && python3 -m http.server 8000 --directory docs"
